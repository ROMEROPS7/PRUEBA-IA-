version: '3.8'
services:
  backend:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - JWT_SECRET=${JWT_SECRET:-change-this-in-production}
      - FRONTEND_URL=http://localhost:8080
      - PORT=3001
    volumes:
      - db-data:/app/backend/database
      - uploads:/app/backend/uploads
      - backups:/app/backend/backups
      - logs:/app/backend/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./styles.css:/usr/share/nginx/html/styles.css:ro
      - ./backend-connector.js:/usr/share/nginx/html/backend-connector.js:ro
      - ./portal-gestor.html:/usr/share/nginx/html/portal-gestor.html:ro
      - ./portal-perito.html:/usr/share/nginx/html/portal-perito.html:ro
      - ./portal-cliente.html:/usr/share/nginx/html/portal-cliente.html:ro
      - ./portal-taller.html:/usr/share/nginx/html/portal-taller.html:ro
      - ./portal-reparador.html:/usr/share/nginx/html/portal-reparador.html:ro
      - ./vista-direccion.html:/usr/share/nginx/html/vista-direccion.html:ro
      - ./saas-panel.html:/usr/share/nginx/html/saas-panel.html:ro
    restart: unless-stopped

volumes:
  db-data:
  uploads:
  backups:
  logs:
