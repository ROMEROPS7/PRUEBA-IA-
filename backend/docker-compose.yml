version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: siniestrosai
      POSTGRES_USER: siniestrosai_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:-SiniestrosAI_2024_Secure!}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siniestrosai_admin -d siniestrosai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: .
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=siniestrosai
      - DB_USER=siniestrosai_admin
      - DB_PASSWORD=${DB_PASSWORD:-SiniestrosAI_2024_Secure!}
      - DB_SSL=false
      - JWT_SECRET=${JWT_SECRET:-cambiar-esto-en-produccion-64-caracteres-minimo-seguro}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=claude-sonnet-4-20250514
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:8080}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:8080,http://localhost:3000}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-cambiar-esto-32-chars-min-seguro}
      - LOG_LEVEL=info
    volumes:
      - uploads:/app/uploads
      - logs:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ../frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
  logs:
