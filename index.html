<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiniestrosAI - SegurCaixa Adeslas</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--blue:#0066FF;--green:#00A651;--dark:#003B71;--bg:#050810;--white:#fff;--gray:#94A3B8}
        body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--white);min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
        .bg-glow{position:fixed;width:600px;height:600px;border-radius:50%;filter:blur(120px);opacity:.15;pointer-events:none}
        .bg-glow.a{top:-200px;left:-200px;background:var(--green)}
        .bg-glow.b{bottom:-200px;right:-200px;background:var(--blue)}
        .login-card{background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:48px;width:420px;position:relative;backdrop-filter:blur(20px)}
        .logo{text-align:center;margin-bottom:32px}
        .logo h1{font-size:24px;font-weight:800}
        .logo h1 span{color:var(--green)}
        .logo p{color:var(--gray);font-size:13px;margin-top:4px}
        .logo .badge{display:inline-block;margin-top:12px;padding:4px 14px;border-radius:20px;background:rgba(0,166,81,.1);border:1px solid rgba(0,166,81,.2);font-size:11px;color:var(--green);font-weight:600}
        .form-group{margin-bottom:20px}
        .form-group label{display:block;font-size:12px;font-weight:600;color:var(--gray);margin-bottom:6px}
        .form-group input{width:100%;padding:14px 16px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);border-radius:12px;color:var(--white);font-size:14px;font-family:inherit;transition:all .2s}
        .form-group input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(0,166,81,.15)}
        .form-group input::placeholder{color:rgba(255,255,255,.3)}
        .btn-login{width:100%;padding:16px;background:linear-gradient(135deg,var(--green),#00C853);border:none;border-radius:14px;color:white;font-size:15px;font-weight:700;cursor:pointer;transition:all .3s;font-family:inherit;margin-top:8px}
        .btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,166,81,.3)}
        .btn-login:disabled{opacity:.5;cursor:not-allowed;transform:none}
        .error-msg{display:none;background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.2);color:#FCA5A5;padding:12px 16px;border-radius:10px;font-size:13px;margin-bottom:16px}
        .error-msg.show{display:block}
        .demo-creds{margin-top:24px;padding:16px;background:rgba(0,102,255,.05);border:1px solid rgba(0,102,255,.1);border-radius:12px;font-size:12px;color:var(--gray)}
        .demo-creds h4{color:var(--blue);margin-bottom:8px;font-size:12px}
        .demo-creds .cred{display:flex;justify-content:space-between;padding:4px 0;cursor:pointer;transition:color .2s}
        .demo-creds .cred:hover{color:var(--white)}
        .spinner{display:none;width:20px;height:20px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto}
        @keyframes spin{to{transform:rotate(360deg)}}
        .portal-select{display:none;margin-top:24px}
        .portal-btn{display:block;width:100%;padding:14px 16px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:12px;color:var(--white);font-size:14px;text-align:left;cursor:pointer;transition:all .2s;margin-bottom:8px;text-decoration:none;font-family:inherit}
        .portal-btn:hover{background:rgba(0,166,81,.1);border-color:rgba(0,166,81,.3);transform:translateX(4px)}
        .portal-btn .icon{margin-right:10px}
        .portal-btn .role{font-size:11px;color:var(--gray);float:right;margin-top:2px}
    </style>
</head>
<body>
    <div class="bg-glow a"></div>
    <div class="bg-glow b"></div>

    <div class="login-card">
        <div class="logo">
            <h1>Siniestros<span>AI</span></h1>
            <p>Plataforma de gestión autónoma de siniestros</p>
            <div class="badge">🟢 SegurCaixa Adeslas — Demo</div>
        </div>

        <div id="loginForm">
            <div class="error-msg" id="errorMsg"></div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" placeholder="tu@email.com" autocomplete="email">
            </div>
            <div class="form-group">
                <label>Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
            </div>
            <button class="btn-login" id="btnLogin" onclick="login()">
                <span id="btnText">Iniciar sesión</span>
                <div class="spinner" id="spinner"></div>
            </button>

            <div class="demo-creds">
                <h4>👤 Credenciales de demo (clic para rellenar)</h4>
                <div class="cred" onclick="fillCreds('admin@segurcaixa.demo','Demo2024!')">
                    <span>📊 Admin</span><span>admin@segurcaixa.demo</span>
                </div>
                <div class="cred" onclick="fillCreds('gestor@segurcaixa.demo','Demo2024!')">
                    <span>👨‍💼 Gestor</span><span>gestor@segurcaixa.demo</span>
                </div>
                <div class="cred" onclick="fillCreds('perito@segurcaixa.demo','Demo2024!')">
                    <span>🔍 Perito</span><span>perito@segurcaixa.demo</span>
                </div>
                <div class="cred" onclick="fillCreds('maria.lopez@demo.com','Demo2024!')">
                    <span>👩 Cliente</span><span>maria.lopez@demo.com</span>
                </div>
            </div>
        </div>

        <div class="portal-select" id="portalSelect">
            <p style="color:var(--gray);font-size:13px;margin-bottom:16px;">Bienvenido, <strong id="userName" style="color:white"></strong>. Selecciona tu portal:</p>
        </div>
    </div>

    <script src="backend-connector.js"></script>
    <script>
        function fillCreds(email, pass) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = pass;
        }

        // Enter para login
        document.getElementById('password').addEventListener('keyup', (e) => { if (e.key === 'Enter') login(); });
        document.getElementById('email').addEventListener('keyup', (e) => { if (e.key === 'Enter') document.getElementById('password').focus(); });

        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const errorEl = document.getElementById('errorMsg');
            const btn = document.getElementById('btnLogin');
            const btnText = document.getElementById('btnText');
            const spinner = document.getElementById('spinner');

            errorEl.classList.remove('show');
            if (!email || !password) { errorEl.textContent = 'Introduce email y contraseña'; errorEl.classList.add('show'); return; }

            btn.disabled = true;
            btnText.style.display = 'none';
            spinner.style.display = 'block';

            try {
                const data = await API.login(email, password);
                showPortals(data.usuario);
            } catch (err) {
                errorEl.textContent = err.message || 'Credenciales incorrectas';
                errorEl.classList.add('show');
                btn.disabled = false;
                btnText.style.display = 'block';
                spinner.style.display = 'none';
            }
        }

        function showPortals(usuario) {
            document.getElementById('loginForm').style.display = 'none';
            const portalDiv = document.getElementById('portalSelect');
            portalDiv.style.display = 'block';
            document.getElementById('userName').textContent = `${usuario.nombre} ${usuario.apellidos || ''}`;

            const portales = {
                superadmin: [
                    { icon: '🛡️', label: 'Super Admin', href: 'superadmin.html' },
                    { icon: '📊', label: 'Dashboard Dirección', href: 'vista-direccion.html' },
                    { icon: '🏢', label: 'Panel SaaS', href: 'saas-panel.html' }
                ],
                admin_empresa: [
                    { icon: '📊', label: 'Dashboard Dirección', href: 'vista-direccion.html' },
                    { icon: '👨‍💼', label: 'Portal Gestor', href: 'portal-gestor.html' },
                    { icon: '🏢', label: 'Control Empresa', href: 'empresa-control.html' },
                    { icon: '🤖', label: 'Agentes IA', href: 'gestor-adeslas.html' }
                ],
                gestor: [
                    { icon: '👨‍💼', label: 'Portal Gestor', href: 'portal-gestor.html' },
                    { icon: '🤖', label: 'Gestión Adeslas', href: 'gestor-adeslas.html' }
                ],
                perito: [
                    { icon: '🔍', label: 'Portal Perito', href: 'portal-perito.html' }
                ],
                taller: [
                    { icon: '🔧', label: 'Portal Taller', href: 'portal-taller.html' }
                ],
                reparador: [
                    { icon: '🛠️', label: 'Portal Reparador', href: 'portal-reparador.html' }
                ],
                cliente: [
                    { icon: '👤', label: 'Mi Portal', href: 'portal-cliente.html' },
                    { icon: '📱', label: 'Portal Adeslas', href: 'cliente-adeslas.html' }
                ]
            };

            const opciones = portales[usuario.tipo] || portales.cliente;
            opciones.forEach(p => {
                const btn = document.createElement('a');
                btn.className = 'portal-btn';
                btn.href = p.href;
                btn.innerHTML = `<span class="icon">${p.icon}</span> ${p.label} <span class="role">${usuario.tipo}</span>`;
                portalDiv.appendChild(btn);
            });

            // Botón de logout
            const logoutBtn = document.createElement('button');
            logoutBtn.className = 'portal-btn';
            logoutBtn.style.marginTop = '16px';
            logoutBtn.style.borderColor = 'rgba(239,68,68,.2)';
            logoutBtn.style.color = '#FCA5A5';
            logoutBtn.innerHTML = '🚪 Cerrar sesión';
            logoutBtn.onclick = () => API.logout();
            portalDiv.appendChild(logoutBtn);
        }

        // Si ya está logueado, mostrar portales directamente
        if (API.isLoggedIn()) {
            showPortals(API.usuario);
        }
    </script>
</body>
</html>
