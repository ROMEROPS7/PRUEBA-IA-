<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SegurCaixa Adeslas — Plataforma Siniestros IA · Demo Completa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --sca-green:#00A651;--sca-green-dark:#007A3D;--sca-green-light:#E8F5E9;
  --sca-blue:#003DA5;--sca-blue-light:#E3EDF7;--sca-red:#E30613;
  --white:#fff;--g50:#F8FAFC;--g100:#F1F5F9;--g200:#E2E8F0;--g300:#CBD5E1;
  --g400:#94A3B8;--g500:#64748B;--g700:#334155;--g900:#0F172A;
}
html,body{height:100%;overflow:hidden;font-family:'Inter',system-ui,sans-serif;background:#0B1120;}

/* TOP BAR */
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;height:56px;
  background:linear-gradient(90deg,#0B1120 0%,#132042 50%,#0B1120 100%);
  border-bottom:1px solid rgba(255,255,255,.08);
  position:relative;z-index:100;
}
.topbar::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:1px;
  background:linear-gradient(90deg,transparent,var(--sca-green),var(--sca-blue),transparent);
  opacity:.5;
}
.logo{display:flex;align-items:center;gap:10px;}
.logo-box{
  width:36px;height:36px;
  background:linear-gradient(135deg,var(--sca-green),var(--sca-blue));
  border-radius:9px;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:13px;color:#fff;
}
.logo-text{color:#fff;font-size:15px;font-weight:700;}
.logo-text .g{color:var(--sca-green);}
.logo-sub{font-size:10px;color:var(--g400);font-weight:500;letter-spacing:.3px;}
.divider{width:1px;height:28px;background:rgba(255,255,255,.12);margin:0 12px;}
.platform-name{font-size:13px;font-weight:600;color:var(--sca-blue);letter-spacing:.3px;
  background:linear-gradient(90deg,var(--sca-green),#5DE8A0);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
}
/* Tabs */
.tabs{display:flex;gap:2px;background:rgba(255,255,255,.04);border-radius:10px;padding:3px;}
.tab{
  padding:7px 16px;border-radius:8px;font-size:12px;font-weight:600;
  color:rgba(255,255,255,.45);border:none;background:none;cursor:pointer;
  transition:all .25s;display:flex;align-items:center;gap:6px;white-space:nowrap;
}
.tab:hover{color:rgba(255,255,255,.8);background:rgba(255,255,255,.06);}
.tab.active{
  color:#fff;
  background:linear-gradient(135deg,var(--sca-green),var(--sca-green-dark));
  box-shadow:0 2px 10px rgba(0,166,81,.35);
}
.tab .ti{font-size:15px;}
/* Status */
.status{display:flex;align-items:center;gap:8px;}
.ai-pill{
  display:flex;align-items:center;gap:5px;
  padding:5px 12px;
  background:rgba(0,166,81,.1);border:1px solid rgba(0,166,81,.25);
  border-radius:20px;font-size:11px;font-weight:600;color:var(--sca-green);
}
.dot{width:6px;height:6px;background:var(--sca-green);border-radius:50%;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
/* CONTENT */
.content{height:calc(100vh - 56px);position:relative;}
.frame{
  position:absolute;top:0;left:0;width:100%;height:100%;
  border:none;background:#fff;
  opacity:0;pointer-events:none;
  transition:opacity .3s ease;
}
.frame.active{opacity:1;pointer-events:all;}
/* Loading overlay */
.loading{
  position:absolute;top:0;left:0;width:100%;height:100%;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:#0B1120;z-index:50;
  transition:opacity .5s;
}
.loading.hidden{opacity:0;pointer-events:none;}
.spinner{
  width:40px;height:40px;border:3px solid rgba(255,255,255,.1);
  border-top-color:var(--sca-green);border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-text{color:var(--g400);font-size:13px;margin-top:12px;font-weight:500;}
@media(max-width:900px){
  .topbar{padding:0 12px;}
  .tab{padding:6px 10px;font-size:11px;}
  .tab .ti{font-size:13px;}
  .logo-text,.divider,.platform-name{display:none;}
}
</style>
</head>
<body>
<nav class="topbar">
  <div style="display:flex;align-items:center;">
    <div class="logo">
      <div class="logo-box">SA</div>
      <div>
        <div class="logo-text">Segur<span class="g">Caixa</span> Adeslas</div>
        <div class="logo-sub">GRUPO MUTUA MADRILEÑA</div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="platform-name">Plataforma Siniestros IA</div>
  </div>
  <div class="tabs">
    <button class="tab active" onclick="switchTab(0,this)"><span class="ti">📊</span> Panel Control</button>
    <button class="tab" onclick="switchTab(1,this)"><span class="ti">📱</span> Área Cliente</button>
    <button class="tab" onclick="switchTab(2,this)"><span class="ti">👤</span> Panel Gestor</button>
    <button class="tab" onclick="switchTab(3,this)"><span class="ti">🤖</span> Portal IA Gestor</button>
    <button class="tab" onclick="switchTab(4,this)"><span class="ti">🎙️</span> Voces IA</button>
  </div>
  <div class="status">
    <div class="ai-pill"><span class="dot"></span> IA Activa · 27 Agentes</div>
  </div>
</nav>
<div class="content">
  <div class="loading" id="loader">
    <div class="spinner"></div>
    <div class="loading-text">Cargando demo...</div>
  </div>
  <iframe class="frame active" id="f0" src="https://htmlpreview.github.io/?https://github.com/ROMEROPS7/PRUEBA-IA-/blob/main/adeslas-demo.html" onload="frameLoaded()"></iframe>
  <iframe class="frame" id="f1" data-src="https://htmlpreview.github.io/?https://github.com/ROMEROPS7/PRUEBA-IA-/blob/main/cliente-adeslas.html"></iframe>
  <iframe class="frame" id="f2" data-src="https://htmlpreview.github.io/?https://github.com/ROMEROPS7/PRUEBA-IA-/blob/main/gestor-adeslas.html"></iframe>
  <iframe class="frame" id="f3" data-src="https://htmlpreview.github.io/?https://github.com/ROMEROPS7/PRUEBA-IA-/blob/main/portal-gestor.html"></iframe>
  <iframe class="frame" id="f4" data-src="https://htmlpreview.github.io/?https://github.com/ROMEROPS7/PRUEBA-IA-/blob/main/selector-voz.html"></iframe>
</div>
<script>
const frames = document.querySelectorAll('.frame');
const loader = document.getElementById('loader');
const loaded = new Set([0]);
function frameLoaded(){
  loader.classList.add('hidden');
}
function switchTab(idx, el){
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  const frame = document.getElementById('f'+idx);
  if(!loaded.has(idx)){
    loader.classList.remove('hidden');
    loaded.add(idx);
    frame.src = frame.dataset.src;
    frame.onload = function(){ loader.classList.add('hidden'); };
  }
  frames.forEach(f => f.classList.remove('active'));
  frame.classList.add('active');
}
</script>
</body>
</html>
